<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Vezo — systems programming, computer graphics, game development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <circle cx="170" cy="90" r="220" fill="url(#glowV)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="250" r="240" fill="url(#glowC)">
      <animate attributeName="cx" values="860;760;860" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- faint hex dump on the right -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a78bfa" fill-opacity="0.22">
      <text x="640" y="70">0000  56 45 5A 4F 00 00 00 00</text>
      <text x="640" y="96">0008  7F 45 4C 46 02 01 01 00</text>
      <text x="640" y="122">0010  52 55 53 54 5A 49 47 21</text>
      <text x="640" y="148">0018  43 2B 2B 20 47 4C 53 4C</text>
      <text x="640" y="174">0020  4F 53 20 44 45 56 21 00</text>
      <text x="640" y="200">0028  00 00 00 00 00 00 00 00</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="82" font-size="20" fill="#7ee787" fill-opacity="0.9">~/vehzaaa <tspan fill="#8b949e">$</tspan> <tspan fill="#c9d1d9">whoami</tspan></text>

      <text x="68" y="172" font-size="104" font-weight="700" fill="url(#name)" textLength="250" lengthAdjust="spacingAndGlyphs">Vezo</text>
      <rect x="338" y="104" width="16" height="78" rx="2" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <text x="72" y="222" font-size="22" fill="#c9d1d9" letter-spacing="0.5">systems programming  <tspan fill="#a78bfa">·</tspan>  computer graphics  <tspan fill="#22d3ee">·</tspan>  game dev</text>
      <text x="72" y="256" font-size="16" fill="#8b949e">// Eswatini  ·  building things from scratch to see why they work</text>
    </g>

    <rect x="0" y="292" width="1000" height="8" fill="url(#name)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
